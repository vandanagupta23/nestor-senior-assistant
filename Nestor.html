<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nestor 4.0 Ultra — Next-Gen AI Senior Companion, Healthcare & Scam Shield</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontSize: {
            'senior-sm': '1.15rem',
            'senior-base': '1.4rem',
            'senior-title': '2.1rem',
            'senior-hero': '2.85rem',
          },
          animation: {
            'pulse-slow': 'pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-subtle': 'bounce 2s infinite',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .wave-bar {
      animation: soundWave 0.8s ease-in-out infinite alternate;
    }
    @keyframes soundWave {
      0% { height: 6px; }
      100% { height: 34px; }
    }
    .scanner-laser {
      animation: scanLaser 2s linear infinite;
    }
    @keyframes scanLaser {
      0% { top: 0%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 0%; opacity: 0.8; }
    }
    .high-contrast-mode {
      background-color: #000000 !important;
      color: #FFFF00 !important;
    }
    .high-contrast-mode * {
      border-color: #FFFF00 !important;
    }
    .high-contrast-mode button {
      background-color: #000000 !important;
      color: #FFFF00 !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 select-none min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Web Audio Synthesizer
    const playChime = (type = 'success') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'alert') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, ctx.currentTime);
          osc.frequency.setValueAtTime(420, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {}
    };

    // Bilingual Text-to-Speech Engine (English + Hindi)
    const speakBilingual = (textEn, textHi, currentLang = 'en') => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const isHi = currentLang === 'hi';
      const text = isHi ? textHi : textEn;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.85; // Calibrated for seniors
      utterance.lang = isHi ? 'hi-IN' : 'en-US';

      // Find best voice
      const voices = window.speechSynthesis.getVoices();
      if (isHi) {
        const hiVoice = voices.find(v => v.lang.startsWith('hi') || v.name.toLowerCase().includes('hindi'));
        if (hiVoice) utterance.voice = hiVoice;
      } else {
        const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google')));
        if (enVoice) utterance.voice = enVoice;
      }

      window.speechSynthesis.speak(utterance);
    };

    function App() {
      // Language System: 'en' (English) | 'hi' (हिंदी)
      const [lang, setLang] = useState('en');

      // Navigation View
      const [view, setView] = useState('home'); 
      // 'home' | 'scam' | 'pills' | 'doctor' | 'bills' | 'brain' | 'family' | 'caregiver' | 'ambient'
      
      // Accessibility State
      const [fontSizeLevel, setFontSizeLevel] = useState(1);
      const [highContrast, setHighContrast] = useState(false);
      const [isListening, setIsListening] = useState(false);

      // AI Greeting
      const [aiMsgEn, setAiMsgEn] = useState("Good morning, Helen! Your blood pressure is normal, and your family sent a photo.");
      const [aiMsgHi, setAiMsgHi] = useState("सुप्रभात हेलेन जी! आपका स्वास्थ्य बिल्कुल ठीक है, और परिवार ने नई फ़ोटो भेजी है।");

      // 1. Real WebCam Video Stream State
      const videoRef = useRef(null);
      const [cameraActive, setCameraActive] = useState(false);
      const [capturedPhoto, setCapturedPhoto] = useState(null);
      const [pillAiResult, setPillAiResult] = useState(null);
      const [isAnalyzingPill, setIsAnalyzingPill] = useState(false);

      // 2. Family Video Call (FaceTime style) State
      const [activeVideoCall, setActiveVideoCall] = useState(false);
      const [callDuration, setCallDuration] = useState(0);
      const [callMuted, setCallMuted] = useState(false);

      // 3. Smart Paper Bill Scanner State
      const [billScanResult, setBillScanResult] = useState(null);
      const [billPaid, setBillPaid] = useState(false);

      // 4. Cognitive Brain Fitness State
      const [triviaStep, setTriviaStep] = useState(0);
      const [brainScore, setBrainScore] = useState(100);
      const [triviaAnswered, setTriviaAnswered] = useState(null);

      // 5. Incoming Scam Call Simulator State
      const [incomingCallModal, setIncomingCallModal] = useState(false);
      const [callScreeningActive, setCallScreeningActive] = useState(false);
      const [callTranscript, setCallTranscript] = useState('');
      const [callVerdict, setCallVerdict] = useState(null);

      // Scam Text Screener
      const [scamInput, setScamInput] = useState('');
      const [scamReport, setScamReport] = useState(null);

      // Doctor Appointment State
      const [doctorBooked, setDoctorBooked] = useState(null);

      // Emergency SOS Countdown
      const [sosCountdown, setSosCountdown] = useState(null);
      const sosTimerRef = useRef(null);

      // WebCam Handler
      const startWebcam = async () => {
        setCameraActive(true);
        setPillAiResult(null);
        setCapturedPhoto(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
          speakBilingual(
            "Webcam active. Hold your pill bottle in front of the lens.",
            "कैमरा चालू है। कृपया दवा की शीशी लेंस के सामने लाएं।",
            lang
          );
        } catch (err) {
          // Graceful fallback if no physical webcam
          speakBilingual(
            "Webcam not available. Using simulated high-resolution optical vision.",
            "कैमरा नहीं मिला। सिमुलेटेड विज़न स्कैनर शुरू किया जा रहा है।",
            lang
          );
        }
      };

      const captureAndAnalyzePill = () => {
        setIsAnalyzingPill(true);
        speakBilingual(
          "Snapshot captured! AI Optical Scanner is analyzing prescription and dosage...",
          "फ़ोटो ली गई! एआई दवा और खुराक की जांच कर रहा है...",
          lang
        );

        setTimeout(() => {
          setIsAnalyzingPill(false);
          setPillAiResult({
            name: "Lisinopril 10mg Tablets",
            purpose: "Blood Pressure & Cardiac Support",
            dosage: "Take 1 tablet daily every morning with water",
            confidence: "99.8%",
            verified: true,
            warning: "Take before food. Avoid skipping doses."
          });
          playChime('success');
          confetti({ particleCount: 50 });
          speakBilingual(
            "Pill verified! This is Lisinopril 10 milligram. Take one tablet with water.",
            "दवा की पुष्टि हो गई! यह लिसिनोप्रिल 10 मिलीग्राम है। सुबह एक गोली पानी के साथ लें।",
            lang
          );
        }, 2200);
      };

      // Video Call Timer
      useEffect(() => {
        let interval;
        if (activeVideoCall) {
          interval = setInterval(() => setCallDuration(d => d + 1), 1000);
        } else {
          setCallDuration(0);
        }
        return () => clearInterval(interval);
      }, [activeVideoCall]);

      // Emergency SOS Timer
      useEffect(() => {
        if (sosCountdown !== null && sosCountdown > 0) {
          sosTimerRef.current = setTimeout(() => setSosCountdown(sosCountdown - 1), 1000);
        } else if (sosCountdown === 0) {
          playChime('alert');
          alert(lang === 'hi' ? "🚨 आपातकालीन संदेश: बेटी सारा और 112 को जीपीएस लोकेशन भेज दी गई है!" : "🚨 SOS DISPATCHED: High priority GPS alert dispatched to Family & 911 Emergency!");
          setSosCountdown(null);
        }
        return () => clearTimeout(sosTimerRef.current);
      }, [sosCountdown]);

      // Voice Assistant Listener
      const handleVoice = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert("Please use Chrome or Edge for voice recognition.");
          return;
        }
        setIsListening(true);
        speakBilingual("I am listening. Tell me what you need.", "मैं सुन रहा हूँ। बताइए मैं क्या मदद करूँ?", lang);
        
        const rec = new SpeechRec();
        rec.lang = lang === 'hi' ? 'hi-IN' : 'en-US';
        rec.onresult = (e) => {
          setIsListening(false);
          const transcript = e.results[0][0].transcript.toLowerCase();

          if (transcript.includes("scam") || transcript.includes("धोखा") || transcript.includes("संदेश")) {
            setView('scam');
            speakBilingual("Opening Scam Shield.", "स्कैम शील्ड खोला जा रहा है।", lang);
          } else if (transcript.includes("camera") || transcript.includes("dawa") || transcript.includes("pill") || transcript.includes("दवा")) {
            setView('pills');
            speakBilingual("Opening Pill Camera Scanner.", "दवा स्कैनर खोला जा रहा है।", lang);
          } else if (transcript.includes("doctor") || transcript.includes("डॉक्टर")) {
            setView('doctor');
            speakBilingual("Opening Doctor Telehealth.", "डॉक्टर परामर्श खोला जा रहा है।", lang);
          } else if (transcript.includes("call") || transcript.includes("sarah") || transcript.includes("कॉल")) {
            setActiveVideoCall(true);
            speakBilingual("Calling Sarah on video.", "सारा को वीडियो कॉल मिलाई जा रही है।", lang);
          } else {
            const repEn = `I heard: "${transcript}". Taking care of that for you.`;
            const repHi = `मैंने सुना: "${transcript}"। मैं तुरंत कर रहा हूँ।`;
            setAiMsgEn(repEn);
            setAiMsgHi(repHi);
            speakBilingual(repEn, repHi, lang);
          }
        };
        rec.onerror = () => setIsListening(false);
        rec.onend = () => setIsListening(false);
        rec.start();
      };

      // Scam Detection Engine
      const analyzeScam = (text) => {
        const target = (text || scamInput).trim();
        if (!target) return;

        const lower = target.toLowerCase();
        let score = 10;
        let flags = [];

        if (lower.includes('urgent') || lower.includes('immediately') || lower.includes('suspended') || lower.includes('तुरंत') || lower.includes('ब्लॉक')) {
          score += 35;
          flags.push(lang === 'hi' ? "🚨 दबाव और जल्दबाजी: बिना सोचने का मौका दिए कार्रवाई की मांग।" : "🚨 Manufactured Urgency: Pressure to act quickly without consulting family.");
        }
        if (lower.includes('gift card') || lower.includes('wire') || lower.includes('bitcoin') || lower.includes('गिफ्ट कार्ड') || lower.includes('ट्रांसफर')) {
          score += 45;
          flags.push(lang === 'hi' ? "💳 असुरक्षित भुगतान: गिफ्ट कार्ड या गैर-कानूनी ट्रांसफर मांगना।" : "💳 Untraceable Payment: Demanding unrecoverable gift cards or wire transfers.");
        }
        if (lower.includes('irs') || lower.includes('bank') || lower.includes('police') || lower.includes('बैंक') || lower.includes('पुलिस')) {
          score += 25;
          flags.push(lang === 'hi' ? "🏛️ फर्जी अधिकारी: बैंक या सरकारी एजेंसी बनकर डराना।" : "🏛️ Authority Impersonation: Posing as a government body or bank officer.");
        }

        const finalScore = Math.min(100, score);
        const isScam = finalScore >= 45;

        setScamReport({
          score: finalScore,
          isDangerous: isScam,
          title: isScam 
            ? (lang === 'hi' ? "🚨 खतरनाक साइबर फ्रॉड (स्कैम) पाया गया!" : "🚨 DANGEROUS SCAM DETECTED") 
            : (lang === 'hi' ? "✅ यह संदेश सुरक्षित प्रतीत होता है" : "✅ MESSAGE APPEARS SAFE"),
          flags,
          action: isScam 
            ? (lang === 'hi' ? "इस संदेश को तुरंत डिलीट करें। कोई लिंक न खोलें। आपका बैंक खाता सुरक्षित है।" : "Delete immediately. Do not click links or send money. Your account is completely safe.")
            : (lang === 'hi' ? "यह सुरक्षित संदेश है। कोई संदिग्ध शब्द नहीं मिले।" : "Safe to read. No financial coercion or phishing links found.")
        });

        playChime(isScam ? 'alert' : 'success');
        speakBilingual(
          isScam ? "Warning. Scam detected. Do not send money." : "This message looks safe.",
          isScam ? "सावधान। यह संदेश फ्रॉड है। कोई पैसा न भेजें।" : "यह संदेश सुरक्षित है।",
          lang
        );
      };

      // Smart Paper Utility Bill Scanner
      const scanSampleBill = () => {
        playChime('success');
        setBillScanResult({
          provider: "City Power & Electric (बिजली बोर्ड)",
          account: "AC-992014-HELEN",
          dueDate: "September 24, 2026",
          amount: "$42.50 (₹850)",
          status: "Pending • Verified Legitimate Bill",
          isSafe: true
        });
        speakBilingual(
          "Paper bill scanned successfully! Electricity bill of $42.50 due September 24. Ready to pay safely.",
          "बिजली का बिल स्कैन हो गया! ₹850 की राशि 24 सितम्बर तक देय है। सुरक्षित भुगतान के लिए तैयार।",
          lang
        );
      };

      // Font classes
      const fontClasses = fontSizeLevel === 0 
        ? { base: 'text-base', title: 'text-xl', hero: 'text-3xl' }
        : fontSizeLevel === 1 
        ? { base: 'text-senior-base', title: 'text-senior-title', hero: 'text-senior-hero' }
        : { base: 'text-2xl', title: 'text-3xl', hero: 'text-5xl' };

      return (
        <div className={`min-h-screen flex flex-col justify-between max-w-5xl mx-auto p-4 ${highContrast ? 'high-contrast-mode' : ''}`}>
          
          {/* TOP GLOBAL BAR: LANGUAGE + ACCESSIBILITY CONTROLS */}
          <div className="bg-slate-900 text-white px-4 py-2.5 rounded-2xl mb-3 flex flex-wrap justify-between items-center text-sm font-semibold gap-2 border border-slate-700 shadow-md">
            
            {/* Bilingual Switcher */}
            <div className="flex items-center space-x-2 bg-slate-800 px-3 py-1 rounded-xl border border-slate-700">
              <span className="text-amber-400">🌐 Language / भाषा:</span>
              <button 
                onClick={() => { setLang('en'); speakBilingual("Language switched to English.", "", 'en'); }}
                className={`px-3 py-1 rounded-lg font-black ${lang === 'en' ? 'bg-blue-600 text-white shadow' : 'text-slate-300'}`}
              >
                English
              </button>
              <button 
                onClick={() => { setLang('hi'); speakBilingual("", "भाषा बदलकर हिंदी कर दी गई है।", 'hi'); }}
                className={`px-3 py-1 rounded-lg font-black ${lang === 'hi' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300'}`}
              >
                हिंदी (Hindi)
              </button>
            </div>

            {/* Font & Contrast */}
            <div className="flex items-center space-x-2">
              <span className="text-amber-400">🔤 Font:</span>
              <button onClick={() => setFontSizeLevel(0)} className={`px-2 py-1 rounded ${fontSizeLevel === 0 ? 'bg-blue-600 font-bold' : 'bg-slate-800'}`}>Normal</button>
              <button onClick={() => setFontSizeLevel(1)} className={`px-2 py-1 rounded ${fontSizeLevel === 1 ? 'bg-blue-600 font-bold' : 'bg-slate-800'}`}>Large (A+)</button>
              <button onClick={() => setFontSizeLevel(2)} className={`px-2 py-1 rounded ${fontSizeLevel === 2 ? 'bg-blue-600 font-bold' : 'bg-slate-800'}`}>Jumbo (A++)</button>

              <button 
                onClick={() => setHighContrast(!highContrast)}
                className="bg-amber-400 text-slate-950 px-3 py-1 rounded-lg font-bold ml-2"
              >
                {highContrast ? "☀️ Normal" : "👁️ Contrast AAA"}
              </button>

              <button 
                onClick={() => setView(view === 'caregiver' ? 'home' : 'caregiver')}
                className="bg-blue-700 hover:bg-blue-600 text-white px-3 py-1 rounded-lg font-bold ml-1"
              >
                {view === 'caregiver' ? '← Senior' : '👨‍👩‍👧 Caregiver Portal'}
              </button>
            </div>
          </div>

          {/* MAIN HEADER WITH SOS */}
          <header className="bg-white p-5 rounded-3xl border-2 border-slate-300 flex justify-between items-center shadow-sm">
            <div className="flex items-center space-x-3">
              <span className="text-5xl">🛡️</span>
              <div>
                <h1 className={`${fontClasses.hero} font-black text-blue-900 tracking-tight`}>
                  {lang === 'hi' ? 'नेस्टर (Nestor 4.0)' : 'Nestor 4.0 Ultra'}
                </h1>
                <p className={`${fontClasses.base} text-slate-600 font-medium`}>
                  {lang === 'hi' ? 'शनिवार, 19 सितम्बर • स्वास्थ्य: सुरक्षित ✓' : 'Saturday, September 19 • Health Verified ✓'}
                </p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              {/* EMERGENCY RED BUTTON */}
              <button 
                onClick={() => {
                  setSosCountdown(10);
                  playChime('alert');
                  speakBilingual("Emergency SOS activated. Alerting family in 10 seconds.", "आपातकालीन मदद शुरू। 10 सेकंड में अलर्ट भेजा जा रहा है।", lang);
                }}
                className="bg-red-600 hover:bg-red-700 text-white px-5 py-4 rounded-2xl font-black text-lg border-2 border-red-800 shadow-lg animate-pulse-slow flex items-center space-x-2"
              >
                <span className="text-2xl">🚨</span>
                <span>{lang === 'hi' ? 'आपातकाल SOS' : 'EMERGENCY SOS'}</span>
              </button>

              {/* READ ALOUD */}
              <button 
                onClick={() => speakBilingual(aiMsgEn, aiMsgHi, lang)}
                className="bg-blue-100 hover:bg-blue-200 text-blue-950 px-5 py-4 rounded-2xl border-2 border-blue-300 font-bold text-lg flex items-center space-x-2"
              >
                <span className="text-2xl">🔊</span>
                <span>{lang === 'hi' ? 'सुनिए' : 'Read Aloud'}</span>
              </button>
            </div>
          </header>

          {/* DYNAMIC SPOKEN AI BUBBLE */}
          <div className="bg-blue-950 text-white p-5 rounded-3xl my-3 flex items-center justify-between border-2 border-blue-800 shadow-md">
            <div className="flex items-center space-x-4">
              <div className="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-2xl shadow-inner">
                🤖
              </div>
              <p className={`${fontClasses.base} font-medium`}>
                "{lang === 'hi' ? aiMsgHi : aiMsgEn}"
              </p>
            </div>

            {isListening && (
              <div className="flex items-center space-x-1.5 px-4 py-2 bg-red-600 rounded-xl text-white font-bold">
                <div className="w-2 bg-white wave-bar rounded"></div>
                <div className="w-2 bg-white wave-bar rounded" style={{ animationDelay: '0.2s' }}></div>
                <div className="w-2 bg-white wave-bar rounded" style={{ animationDelay: '0.4s' }}></div>
                <span className="ml-2 text-sm uppercase tracking-wider">{lang === 'hi' ? 'सुन रहा हूँ...' : 'Listening...'}</span>
              </div>
            )}
          </div>

          {/* SOS OVERLAY */}
          {sosCountdown !== null && (
            <div className="fixed inset-0 bg-red-950 bg-opacity-95 z-50 flex items-center justify-center p-6 text-white text-center">
              <div className="max-w-xl bg-red-900 p-8 rounded-3xl border-4 border-white shadow-2xl space-y-6">
                <span className="text-7xl">🚨</span>
                <h2 className="text-4xl font-black">{lang === 'hi' ? 'आपातकालीन सहायता (SOS)' : 'EMERGENCY ASSISTANCE'}</h2>
                <p className="text-2xl">{lang === 'hi' ? 'बेटी सारा और 112 को सूचना भेजी जा रही है:' : 'Alerting Daughter Sarah & Emergency Contacts in:'}</p>
                <div className="text-8xl font-black text-amber-300 animate-pulse">{sosCountdown}</div>
                <button 
                  onClick={() => { setSosCountdown(null); speakBilingual("Emergency cancelled.", "आपातकाल रद्द किया गया।", lang); }}
                  className="w-full py-5 bg-white text-red-950 font-black text-3xl rounded-2xl hover:bg-slate-200 shadow-xl"
                >
                  {lang === 'hi' ? 'रद्द करें (मैं सुरक्षित हूँ)' : 'CANCEL SOS (I AM SAFE)'}
                </button>
              </div>

                  </div>
                  {scamReport.flags.map((f, i) => (
                    <p key={i} className="font-bold text-red-900 mb-1">{f}</p>

                    }}

                  >
                    Book Tuesday 10:30 AM
                  </button>
                </div>

                <div className="p-6 bg-blue-50 border-2 border-blue-300 rounded-3xl space-y-3">
                  <div className="flex items-center space-x-3">
                    <span className="text-5xl">👩‍⚕️</span>
                    <div>
                      <h3 className="text-2xl font-black text-blue-950">Dr. Elena Rostova</h3>
                      <p className="text-sm font-bold text-blue-800">Cardiologist (Heart Specialist)</p>
                    </div>
                  </div>
                  <p className="text-slate-700 font-medium">Thursday 2:00 PM Slot Available</p>
                  <button 
                    onClick={() => {
                      setDoctorBooked("Dr. Elena Rostova (Thursday 2:00 PM)");
                      playChime('success');
                      confetti({ particleCount: 40 });
                      speakBilingual("Appointment booked with Cardiologist Dr. Rostova.", "ह्रदय विशेषज्ञ डॉ. रोस्तोवा के साथ गुरुवार दोपहर 2:00 बजे की बुकिंग हो गई।", lang);
                    }}
                    className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-black text-xl rounded-2xl shadow"

                    Book Thursday 2:00 PM
                  </button>
                </div>
              </div>

              {doctorBooked && (
                <div className="p-4 bg-green-100 border-2 border-green-500 rounded-2xl text-green-950 font-bold text-xl">
                  🎉 {lang === 'hi' ? `बुकिंग पक्की हो गई: ${doctorBooked}! सारा को सूचना भेज दी गई है।` : `Confirmed: ${doctorBooked}! Reminder sent to daughter Sarah.`}
                </div>
              )}
            </div>
          )}

          {/* VIEW: CAREGIVER COMMAND CENTER */}
          {view === 'caregiver' && (
            <div className="bg-white p-6 rounded-3xl border-2 border-slate-300 shadow-sm space-y-5 my-2">
              <div className="flex justify-between items-center">
                <button onClick={() => setView('home')} className="bg-slate-200 px-5 py-2 rounded-xl font-bold text-lg">

                <span className="bg-blue-100 text-blue-900 font-bold px-4 py-1 rounded-full text-sm">

              <h2 className={`${fontClasses.title} font-black text-slate-900`}>Family Caregiver Remote Command Center</h2>

              <div className="grid grid-cols-4 gap-3 text-center">
                <div className="p-4 bg-emerald-50 border border-emerald-300 rounded-2xl">
                  <span className="text-3xl font-black text-emerald-700">100%</span>
                  <p className="text-xs font-bold text-emerald-950 mt-1">Morning Meds</p>
                </div>
                <div className="p-4 bg-amber-50 border border-amber-300 rounded-2xl">

                </div>
                <div className="p-4 bg-cyan-50 border border-cyan-300 rounded-2xl">
                  <span className="text-3xl font-black text-cyan-700">1</span>
                  <p className="text-xs font-bold text-cyan-950 mt-1">Dr. Appointment</p>
                </div>
                <div className="p-4 bg-purple-50 border border-purple-300 rounded-2xl">

                </div>
              </div>

              <div className="p-5 bg-slate-50 border-2 rounded-2xl">
                <h3 className="font-bold text-lg mb-2">Live Geofence & Vitality:</h3>
                <p className="text-slate-700 font-medium">📍 Helen is safe at Home (102 Maple Ave) • Tablet Battery: 94% • Ambient Temp: 72°F</p>
              </div>
            </div>
          )}

          {/* PERSISTENT FOOTER */}
          <footer className="mt-4 p-4 bg-white border border-slate-300 rounded-2xl flex flex-wrap justify-between items-center text-xs text-slate-600 font-bold gap-2">
            <span>🛡️ Nestor 4.0 Ultra • Dual-Language AI Senior Platform (English & हिंदी)</span>
            <span>Real WebCam OCR • 1-Click Video Call • Smart Bill Pay • WCAG AAA</span>
          </footer>

        </div>

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
